services:
  agent:
    build: .
    container_name: goodthing-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_URL: ${SERVER_URL:-https://probe.lightstars.eu.org/}
      INSTALL_SCRIPT_URL: ${INSTALL_SCRIPT_URL:-https://probe.lightstars.eu.org/install-agent.sh}
      TOKEN: ${TOKEN:-}
      AEGIS_DATA_DIR: /data/aegis-agent
      HEALTH_PORT: "7682"
    ports:
      - "7682:7682/tcp"
      - "7682:7682/udp"
    volumes:
      - agent-data:/data

volumes:
  agent-data:
